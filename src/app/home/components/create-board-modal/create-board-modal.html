<form
  class="flex flex-col gap-6 rounded-xl bg-zinc-800 p-6 text-white shadow-lg"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <h2 class="mb-5 text-center text-xl font-semibold text-stone-300">Створити дошку</h2>

  <label class="flex flex-col gap-2">
    <span class="text-stone-400">Назва дошки</span>
    <input
      type="text"
      placeholder="введіть назву дошки"
      class="rounded-md bg-zinc-900 p-1.5 placeholder-stone-500 focus:ring-2 focus:ring-stone-400 focus:outline-none"
      formControlName="title"
    />
    <div class="min-h-5 text-xs text-red-400">
      @if (form.controls['title']?.dirty || form.controls['title']?.touched) {
         @if(form.controls['title']?.errors?.['required']) {
          <small>Поле обов’язкове</small>
        }
        @if (form.controls['title']?.errors?.['pattern']) {
          <small>Назва недійсна</small>
        }
      } @else {
      <small class="invisible"> </small>
      }
    </div>
  </label>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="mt-2 cursor-pointer rounded-lg bg-zinc-700 py-1.5 font-semibold text-stone-200 transition-all duration-200 hover:bg-zinc-600 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-red-400"
  >
    Створити
  </button>

  <button type="button" (click)="closeModal()" class="text-stone-400 underline hover:text-stone-200">
    <span class="cursor-pointer">Закрити</span>
  </button>
</form>
