<div class="bg-dark-3 container mx-auto mt-8 w-[80vw] rounded-2xl">
  <div class="grid gap-6 py-8">
    <h1 class="text-center font-bold">{{ title }}</h1>

    <div class="flex flex-wrap justify-center gap-4">
      @for (board of store.boards(); track board.id){
      <div class="relative">
        <a
          [ngStyle]="{background: board.custom.color}"
          [routerLink]="['/board', board.id]"
          class="board-size block truncate rounded-md p-2 wrap-break-word text-black opacity-90 hover:opacity-100"
        >
          {{ board.title }}
        </a>
        <tr-btn
          [label]="'видалити'"
          [role]="'delete'"
          [action]="getRemoveBoardCallback(board.id, board.title)"
          [disabled]="store.isBoardDeleting()"
          class="absolute right-1 bottom-1 p-0 text-xs"
        >
        </tr-btn>
      </div>
    }
    <tr-btn
    [label]="'+ Створити дошку'"
    [role]="'createBoard'"
    [action]="addBoard"
    [disabled]="store.isBoardCreating()"
    ></tr-btn>
  </div>
</div>
</div>
