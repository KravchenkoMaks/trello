<div class="bg-dark-3 container mx-auto mt-8 w-[80vw] rounded-2xl">
  <div class="grid gap-6 py-8">
    <h1 class="text-center font-bold">{{ title }}</h1>

    <div class="flex flex-wrap justify-center gap-4">
      @for (board of store.boards(); track board.id){
      <div class="relative">
        <a
          [ngStyle]="{background: board.custom.color}"
          [routerLink]="['/board', board.id]"
          class="board-size block truncate rounded-md p-2 text-black opacity-90 hover:opacity-100 wrap-break-word"
        >
          {{ board.title }}
        </a>
        <tr-btn
          [label]="'delete'"
          [role]="'delete'"
          [action]="getDeleteBoardCallback(board.id)"
          [disabled]="store.boardCreating() || store.boardDeleting()"
          class="absolute bottom-1 right-1 p-0 text-xs"
        >
        </tr-btn>
      </div>
      }
      <tr-btn
        [label]="'+ Створити дошку'"
        [role]="'createBoard'"
        [action]="createBoard"
        [loading]="store.boardCreating()"
        [disabled]="store.boardCreating()"
      ></tr-btn>
    </div>
  </div>
</div>
