<div class="main-container">
  <div class="main-container-header flex justify-center">
    <h1 class="font-bold">{{ title }}</h1>
  </div>

  <div class="main-container-body justify-center">
    <div>
      <div class="flex flex-wrap justify-center gap-4">
        @for (board of store.boards(); track board.id){
        <div class="group relative">
          <div class="board-h board-w relative grid grid-rows-[1fr_auto] overflow-hidden rounded-(--r8)">
            <a
              [routerLink]="['/board', board.id]"
              class="absolute inset-0 z-10"
              aria-label="Go to {{board.title}}"
            ></a>

            <div [ngStyle]="{background: board.custom.color}" class="text-dark-4 z-0 min-h-10"></div>

            <div class="bg-dark-800 text-zinc-400 font-bold relative z-0 px-4 py-0.5 wrap-break-word">
              {{ board.title }}
            </div>
          </div>

          <tr-btn
            name="deleteBoardSvg"
            [action]="getDeleteBoardCallback(board.id, board.title)"
            [disabled]="store.isBoardDeleting()"
            aria-label="Delete board {{board.title}}"
            class="absolute top-2 right-3 z-20"
          >
          </tr-btn>
        </div>
        }
        <tr-btn
          label="+ Create new board"
          name="createBoard"
          [action]="addBoard"
          [disabled]="store.isBoardCreating()"
        ></tr-btn>
      </div>
    </div>
  </div>
</div>
