<div class="bg-dark-3 container mx-auto mt-8 w-[80vw] rounded-(--r16)">
  <div class="grid gap-6 py-8">
    <h1 class="text-center font-bold">{{ title }}</h1>

    <div class="flex flex-wrap justify-center gap-4">
      @for (board of store.boards(); track board.id){
      <div class="relative">
        <a
          [ngStyle]="{background: board.custom.color}"
          [routerLink]="['/board', board.id]"
          class="board-size block truncate rounded-(--r6) p-2 wrap-break-word text-dark-4 opacity-90 hover:opacity-100"
        >
          {{ board.title }}
        </a>
        <tr-btn
          label="delete"
          role="delete"
          [action]="getDeleteBoardCallback(board.id, board.title)"
          [disabled]="store.isBoardDeleting()"
          class="absolute right-1 bottom-1 p-0"
        >
        </tr-btn>
      </div>
      }
      <tr-btn label="+ add board" role="createBoard" [action]="addBoard" [disabled]="store.isBoardCreating()"></tr-btn>
    </div>
  </div>
</div>
