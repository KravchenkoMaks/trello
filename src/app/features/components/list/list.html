<div class="list-w bg-dark-2 flex flex-col gap-3 rounded-(--r8) p-2">
  <h3>{{list().title}}</h3>

  <div class="flex  flex-col gap-1.5">
    @for(card of list().cards; track card.id){
    <tr-card class="wrap-break-word" [card]="card"></tr-card>
    }
    <tr-btn role="createCard" label="+ add card" [disabled]="isCardCreating()" [action]="addCard"></tr-btn>
  </div>
</div>
