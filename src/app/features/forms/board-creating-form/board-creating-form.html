<div class="m-4 grid gap-3">
  <form class="flex flex-col gap-4" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div>
      <tr-single-text-input
        formControlName="title"
        type="text"
        label="Board name"
        placeholder="Input board name ..."
        bg="dark"
      ></tr-single-text-input>

      <tr-validation-error [control]="titleCtrl"></tr-validation-error>
    </div>

    <tr-btn type="submit" name="createBoardConfirm" [disabled]="formGroup.invalid" label="Create"></tr-btn>
  </form>
</div>
