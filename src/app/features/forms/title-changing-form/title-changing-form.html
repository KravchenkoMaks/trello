<div class="text-wrap break-normal">
  <form [formGroup]="formGroup">
    @if (!isEditing()) {
    <tr-btn name="changeTitle" [label]="currentTitle()" [action]="enableEdit" [disabled]="store.isBoardUpdating()"></tr-btn>
    } @else{
    <tr-dynamic-text-input
      #inputRef
      formControlName="title"
      (keydown.enter)="saveEdit('enter')"
      (blurEvent)="saveEdit('blur')"
    ></tr-dynamic-text-input>

    <tr-validation-error [control]="titleCtrl"></tr-validation-error>
    }
  </form>
</div>
