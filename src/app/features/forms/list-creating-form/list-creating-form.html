<div class="list-container list-w">
  <form class="flex flex-col gap-1" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div>
      <tr-single-text-input
        type="text"
        label="+add list"
        placeholder="Enter list name"
        bg="darkMedium"
        formControlName="title"
      ></tr-single-text-input>

      <tr-validation-error [control]="titleCtrl"></tr-validation-error>
    </div>

    <div class="flex gap-1">

      <tr-btn type="submit" label="Add list" name="confirm" [disabled]="formGroup.invalid || store.isListCreating()"  />
      
      <tr-btn name="closeSvg" [action]="close"></tr-btn>
      
    </div>
  </form>
</div>
