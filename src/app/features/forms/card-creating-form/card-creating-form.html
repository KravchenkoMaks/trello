<div>
  <form class="flex flex-col gap-1" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div>
      <tr-single-text-input      
        type="textarea"
        label="+add card"
        placeholder="Enter a title"
        bg="darkLight"
        formControlName="title"
        (saved)="createFromInput($event)"
      ></tr-single-text-input>

      <tr-validation-error [control]="titleCtrl"></tr-validation-error>
    </div>

    <div class="flex gap-1">
      <tr-btn type="submit" label="Add card" name="confirm" [disabled]="formGroup.invalid || store.isCardCreating()" />

      <tr-btn name="closeSvg" [action]="close"></tr-btn>
    </div>
  </form>
</div>
