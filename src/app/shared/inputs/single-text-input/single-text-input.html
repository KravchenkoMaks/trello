@if (type() === 'text') {
<label class="flex flex-col gap-1">
  <input
    trAutofocus
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="handleBlur()"
    [ngClass]="getInputClasses()"
  />
</label>
}@else {
<label class="flex flex-col gap-1">
  <textarea
    trAutofocus
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [value]="value"
    (input)="autoResize($event)"
    (keydown.enter)="onEnter($any($event))"
    (blur)="handleBlur()"
    [ngClass]="getInputClasses()"
    rows="2"
  ></textarea>
</label>
}
