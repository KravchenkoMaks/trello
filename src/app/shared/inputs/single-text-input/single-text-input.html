@if (type() === 'text') {
<label class="flex flex-col gap-1">
  <input
    trAutofocus
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    (blur)="handleBlur()"
    [ngClass]="getInputClasses()"
    class="rounded-xs text-lg py-0.5"
  />
</label>
}@else {
<label class="flex flex-col gap-1">
  <textarea
    trAutofocus
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [value]="value"
    (input)="autoResize($event)"
    (keydown.enter)="onEnter(($any($event)))"
    (blur)="handleBlur()"
    [ngClass]="getInputClasses()"
    rows="2"
    class="w-full px-2 py-1 bg-dark-800 text-white rounded-(--r8) resize-none"
  ></textarea>
</label>
}
