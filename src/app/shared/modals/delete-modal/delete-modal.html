<div class=" text-title-light bg-dark-2 grid justify-items-center gap-3 rounded-(--r12) p-4 text-t-12">
  
  <p>Are you sure you want to delete {{ itemType() }}?</p>

  <p class="mt-1 flex font-bold text-title">
    &apos;
    <span class="line-clamp-1 max-w-48 truncate">{{ itemName() }}</span>
    &apos;
  </p>

  <div class="mt-1 flex justify-center gap-4">
    <tr-btn label="Cancel" role="cancel" [action]="close"></tr-btn>
    <tr-btn label="Delete" role="delete" [action]="confirm"></tr-btn>
  </div>
</div>
