<div trClickOutside (trClickOutside)="onSubmit('blur')">

  <form class="flex flex-col gap-1" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div>
      <tr-single-text-input
        type="textarea"
        label="+add card"
        placeholder="Enter a title"
        bg="darkLight"
        formControlName="title"
        (savedByEnter)="onSubmit('enter')"
      ></tr-single-text-input>

      <tr-validation-error [control]="titleCtrl" />
    </div>

    <div class="flex gap-1">
      <tr-btn type="submit" label="Add card" name="confirm" [disabled]="formGroup.invalid " />

      <tr-btn name="closeSvg" [action]="close"></tr-btn>
    </div>
  </form>
</div>
