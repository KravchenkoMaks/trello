<form [formGroup]="form">
  @if (!isEditing()) {
  <tr-btn [role]="'changeTitle'" [label]="currentText()" [action]="enableEdit" [disabled]="isDisabled()"></tr-btn>
  } @else{
  <tr-text-input
    #inputRef
    formControlName="inputText"
    [control]="textControl"
    [type]="'text'"
    [ring]="'mono'" 
    [bg]="'darkMedium'"   
    (keydown.enter)="saveEdit('enter')"
    (blurEvent)="saveEdit('blur')"
  ></tr-text-input>

  <small class="min-h-4 text-xs text-red-400"> {{ textControl | validationMessages }} </small>
  }
</form>
