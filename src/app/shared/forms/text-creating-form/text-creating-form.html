<form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <tr-text-input
      formControlName="title"
      [type]="'text'"
      [placeholder]="placeholder()"
      [label]="label()"
      [role]="'createBoard'"
      [control]="titleControl"
    ></tr-text-input>

    <small class="min-h-4 text-xs text-red-400"> {{ titleControl | validationMessages }} </small>
  </div>

  <tr-btn [type]="'submit'" [role]="'create'" [disabled]="form.invalid" [label]="'Створити'"></tr-btn>
</form>
